workflows:
  android-workflow:
    name: SabzTar Android Build
    max_build_duration: 60

    environment:
      android_signing:
        - sabztar_keystore
      vars:
        PACKAGE_NAME: "com.sabztar.app"

    scripts:
      - name: Build APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
